[project]
name = "ev-dispatch-rl-summative"
version = "0.1.0"
description = "Mission-based RL: EV fleet charging and dispatch scheduler"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "gymnasium>=0.29.1",
    "stable-baselines3>=2.3.0",
    "torch>=2.1.0",
    "numpy>=1.24.0,<2.0",
    "pygame>=2.5.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "tensorboard>=2.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment", "training"]

[tool.uv]
package = true

[project.scripts]
ev-train = "main:main"
ev-play = "play:main"
